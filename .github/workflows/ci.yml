name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install just
        run: cargo install just --version 1.59.0 --locked
      - name: Run shared checks and PTY tests
        run: just ci
      - name: Build release
        run: just release
